name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0, 1.0.0-rc6)'
        required: true
        type: string
      git-rev:
        description: 'Branch to release from; the workflow pushes the version bump to this branch'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

concurrency:
  group: secrethub-release
  cancel-in-progress: false

env:
  ELIXIR_VERSION: '1.18'
  OTP_VERSION: '28'
  MIX_ENV: 'prod'

jobs:
  prepare-release:
    name: Prepare Release Commit
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.bump.outputs.release_sha }}
      build_time: ${{ steps.bump.outputs.build_time }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs['git-rev'] }}
          fetch-depth: 0

      - name: Normalize version and branch
        id: release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"
          REF="${{ inputs['git-rev'] }}"
          BRANCH="${REF#refs/heads/}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like 1.2.3 or 1.2.3-rc1. Build metadata is not supported because Docker tags cannot contain '+'."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin."
            exit 1
          fi

          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Release source '$REF' must be a branch so the workflow can push the version bump."
            exit 1
          fi

          git checkout -B "$BRANCH" "origin/$BRANCH"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump project versions
        id: bump
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail

          version_files=(
            mix.exs
            apps/secrethub_core/mix.exs
            apps/secrethub_web/mix.exs
            apps/secrethub_agent/mix.exs
            apps/secrethub_shared/mix.exs
            apps/secrethub_cli/mix.exs
            apps/secrethub_human/mix.exs
            Dockerfile.core-standalone
            apps/secrethub_core/Dockerfile
            apps/secrethub_agent/Dockerfile
          )

          for file in "${version_files[@]}"; do
            perl -0pi -e 's/version: "[^"]+"/version: "'"${VERSION}"'"/; s/      version="[^"]+"/      version="'"${VERSION}"'"/' "$file"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- "${version_files[@]}"; then
            echo "Versions already set to ${VERSION}."
          else
            git add "${version_files[@]}"
            git commit -m "chore(release): ${TAG}"
            git push origin "HEAD:${BRANCH}"
          fi

          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  publish-cli-hex:
    name: Publish CLI to Hex.pm
    runs-on: ubuntu-24.04
    needs:
      - prepare-release
      - build-core-release
      - build-agent-release
      - build-agent-freebsd
      - build-docker-images
    permissions:
      contents: read

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-prod-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-prod-

      - name: Install dependencies
        shell: bash
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod

      - name: Publish package
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${HEX_API_KEY:-}" ]; then
            echo "::error::Set the HEX_API_KEY repository secret before running the release workflow."
            exit 1
          fi

          cd apps/secrethub_cli
          mix hex.publish package --yes

  build-core-release:
    name: Build Core Release (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: prepare-release
    env:
      SECRET_HUB_GIT_REF: ${{ needs.prepare-release.outputs.tag }}
      SECRET_HUB_GIT_SHA: ${{ needs.prepare-release.outputs.release_sha }}
      SECRET_HUB_BUILD_TIME: ${{ needs.prepare-release.outputs.build_time }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # DuskmoonBundler's GNU native compiler requires Ubuntu 26.04 (upstream #9).
          - target: linux-amd64
            runner: ubuntu-26.04
          - target: linux-arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            node_modules
            apps/secrethub_web/node_modules
          key: ${{ matrix.runner }}-${{ runner.arch }}-mix-core-prod-${{ hashFiles('**/mix.lock', 'package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ matrix.runner }}-${{ runner.arch }}-mix-core-prod-

      - name: Install dependencies
        shell: bash
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
          mix npm.ci

      - name: Compile application
        run: mix compile --warnings-as-errors

      - name: Build frontend assets
        shell: bash
        run: |
          set -euo pipefail
          mix duskmoon_bundler.build secrethub_web --tailwind
          mix phx.digest --no-compile

      - name: Build Core release
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf _build/prod/rel/secrethub_core
          mix release secrethub_core
          elixir scripts/verify_release_versions.exs _build/prod/rel/secrethub_core "$RELEASE_VERSION"

      - name: Package Core release
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          artifact="secrethub_core-${RELEASE_TAG}-${RELEASE_TARGET}.tar.gz"
          tar -C _build/prod/rel/secrethub_core -czf "$artifact" .

      - name: Upload Core release artifact
        uses: actions/upload-artifact@v4
        with:
          name: secrethub-core-${{ matrix.target }}
          path: secrethub_core-${{ needs.prepare-release.outputs.tag }}-${{ matrix.target }}.tar.gz
          retention-days: 7

  build-agent-release:
    name: Build Agent Release (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: prepare-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            archive: tar.gz
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - target: macos-amd64
            runner: macos-26-intel
            archive: tar.gz
          - target: macos-arm64
            runner: macos-26
            archive: tar.gz
          - target: windows-amd64
            runner: windows-2025
            archive: zip

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-agent-prod-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-agent-prod-

      - name: Install dependencies
        working-directory: apps/secrethub_agent
        shell: bash
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod

      - name: Compile application
        working-directory: apps/secrethub_agent
        run: mix compile

      - name: Build Agent release
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf _build/prod/rel/secrethub_agent
          mix release secrethub_agent --no-compile --no-deps-check
          elixir scripts/verify_release_versions.exs _build/prod/rel/secrethub_agent "$RELEASE_VERSION"

      - name: Check Agent configuration commands (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          agent_config_file="$(mktemp)"
          trap 'rm -f "$agent_config_file"' EXIT
          _build/prod/rel/secrethub_agent/bin/secrethub_agent config generate > "$agent_config_file"
          cmp rel/agent/overlays/config/agent.example.toml "$agent_config_file"
          _build/prod/rel/secrethub_agent/bin/secrethub_agent config validate "$agent_config_file"

      - name: Check Agent configuration commands (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $launcher = Join-Path $PWD '_build/prod/rel/secrethub_agent/bin/secrethub_agent.bat'
          $agentConfigFile = Join-Path ([System.IO.Path]::GetTempPath()) ("secrethub-agent-" + [guid]::NewGuid().ToString('N') + '.toml')
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          try {
            $generated = & $launcher config generate
            if ($LASTEXITCODE -ne 0) { throw 'Agent config generate failed' }
            [System.IO.File]::WriteAllLines($agentConfigFile, [string[]]$generated, $utf8)
            & $launcher config validate $agentConfigFile
            if ($LASTEXITCODE -ne 0) { throw 'Agent config validate rejected the generated configuration' }
            [System.IO.File]::WriteAllText($agentConfigFile, 'core_url = "unterminated', $utf8)
            & $launcher config validate $agentConfigFile
            if ($LASTEXITCODE -ne 1) { throw 'Agent config validate did not return exit code 1 for malformed TOML' }
          } finally {
            Remove-Item $agentConfigFile -Force -ErrorAction SilentlyContinue
          }
          exit 0

      - name: Package Agent tarball
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          artifact="secrethub_agent-${RELEASE_TAG}-${RELEASE_TARGET}.tar.gz"
          tar -C _build/prod/rel/secrethub_agent -czf "$artifact" .

      - name: Package Agent zip
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $artifact = "secrethub_agent-$env:RELEASE_TAG-$env:RELEASE_TARGET.zip"
          Compress-Archive -Path "_build/prod/rel/secrethub_agent/*" -DestinationPath $artifact -Force

      - name: Upload Agent release artifact
        uses: actions/upload-artifact@v4
        with:
          name: secrethub-agent-${{ matrix.target }}
          path: secrethub_agent-${{ needs.prepare-release.outputs.tag }}-${{ matrix.target }}.${{ matrix.archive }}
          retention-days: 7

  build-agent-freebsd:
    name: Build Agent Release (freebsd-amd64)
    runs-on: ubuntu-24.04
    needs: prepare-release
    permissions:
      contents: read

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Build inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          sync: rsync
          copyback: true
          prepare: |
            pkg install -y erlang-runtime28 elixir git gmake bash curl
          run: |
            set -e
            export PATH="/usr/local/lib/erlang28/bin:$PATH"
            export MIX_ENV=prod
            export RELEASE_TAG="${{ needs.prepare-release.outputs.tag }}"

            mix local.hex --force
            mix local.rebar --force
            cd apps/secrethub_agent
            mix deps.get --only prod
            mix compile
            cd ../..
            mix release secrethub_agent --no-compile --no-deps-check
            elixir scripts/verify_release_versions.exs _build/prod/rel/secrethub_agent "${RELEASE_TAG#v}"
            agent_config_file="$(mktemp)"
            trap 'rm -f "$agent_config_file"' EXIT
            _build/prod/rel/secrethub_agent/bin/secrethub_agent config generate > "$agent_config_file"
            _build/prod/rel/secrethub_agent/bin/secrethub_agent config validate "$agent_config_file"
            tar -C _build/prod/rel/secrethub_agent -czf "secrethub_agent-${RELEASE_TAG}-freebsd-amd64.tar.gz" .

      - name: Upload FreeBSD Agent release artifact
        uses: actions/upload-artifact@v4
        with:
          name: secrethub-agent-freebsd-amd64
          path: secrethub_agent-${{ needs.prepare-release.outputs.tag }}-freebsd-amd64.tar.gz
          retention-days: 7

  build-docker-images:
    name: Build Docker Image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    needs: prepare-release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core
            dockerfile: Dockerfile.core
            title: SecretHub Core
          - image: core-standalone
            dockerfile: Dockerfile.core-standalone
            title: SecretHub Core Standalone
          - image: agent
            dockerfile: Dockerfile.agent
            title: SecretHub Agent

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ needs.prepare-release.outputs.tag }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:sha-${{ needs.prepare-release.outputs.release_sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare-release.outputs.release_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            SECRET_HUB_GIT_REF=${{ needs.prepare-release.outputs.tag }}
            SECRET_HUB_GIT_SHA=${{ needs.prepare-release.outputs.release_sha }}
            SECRET_HUB_BUILD_TIME=${{ needs.prepare-release.outputs.build_time }}

      - name: Verify packaged Core trust offline
        if: ${{ matrix.image != 'agent' }}
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: bash scripts/verify-pki-trust-image.sh "$IMAGE" "$RELEASE_TAG" "$RELEASE_SHA"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - prepare-release
      - publish-cli-hex
      - build-core-release
      - build-agent-release
      - build-agent-freebsd
      - build-docker-images
    permissions:
      contents: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0

      - name: Create and push tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists on origin."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: secrethub-*
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          PREV_TAG="$(git describe --tags --abbrev=0 "${RELEASE_SHA}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG_LINK="Full changelog: https://github.com/${REPOSITORY}/compare/${PREV_TAG}...${RELEASE_TAG}"
          else
            CHANGELOG_LINK="Commit history: https://github.com/${REPOSITORY}/commits/${RELEASE_TAG}"
          fi

          cat > release_notes.md <<EOF
          # SecretHub ${RELEASE_TAG}

          ## Changes

          - HTTP clients now use \`http_fetch 1.0.0-rc.8\`. Agent WebSockets
            use \`http_web_socket 1.0.0-rc.8\` through the public Phoenix Socket
            Client transport; Req, websocket_client, and the custom transport
            have been removed. Real Core-Agent mTLS and both TLS 1.2 and TLS 1.3
            trust/hostname regressions passed with this package cohort.
          - Core and Human persistent jobs now use \`Styx 0.1.1\`. Existing Oban
            v14 jobs are preserved by an explicit database migration. Back up
            the database and read the
            [Styx migration guide](https://github.com/${REPOSITORY}/blob/${RELEASE_TAG}/docs/styx-migration.md)
            before upgrading. Job processing remains subject to the configured
            launch profile and feature gates.
          - DuskmoonBundler 10.1.2 replaces the Bun and Tailwind Mix packages.
            Production assets use relocated runtime manifests; build-only
            dependencies are excluded from packaged applications. Agent archive
            builds compile only the Agent dependency graph, including on Windows.
          - Hex dependencies and the shared HTTP release cohort are refreshed.
            Bandit remains in use while Gaoxy's explicit dual-stack listener
            prerequisite is unresolved; see
            [the migration status](https://github.com/${REPOSITORY}/blob/${RELEASE_TAG}/docs/agents/gaoxy-migration-preflight.md).

          ## Artifacts

          ### Core releases
          - \`secrethub_core-${RELEASE_TAG}-linux-amd64.tar.gz\`
          - \`secrethub_core-${RELEASE_TAG}-linux-arm64.tar.gz\`

          ### Agent releases
          - \`secrethub_agent-${RELEASE_TAG}-linux-amd64.tar.gz\`
          - \`secrethub_agent-${RELEASE_TAG}-linux-arm64.tar.gz\`
          - \`secrethub_agent-${RELEASE_TAG}-macos-amd64.tar.gz\`
          - \`secrethub_agent-${RELEASE_TAG}-macos-arm64.tar.gz\`
          - \`secrethub_agent-${RELEASE_TAG}-windows-amd64.zip\`
          - \`secrethub_agent-${RELEASE_TAG}-freebsd-amd64.tar.gz\`

          ### Docker images
          - \`ghcr.io/${REPOSITORY}/core:${RELEASE_TAG}\`
          - \`ghcr.io/${REPOSITORY}/core-standalone:${RELEASE_TAG}\`
          - \`ghcr.io/${REPOSITORY}/agent:${RELEASE_TAG}\`

          After release creation succeeds, the \`:latest\` tags for \`core\`,
          \`core-standalone\`, and \`agent\` are promoted to the same multi-platform
          images as their corresponding versioned tags, including prereleases.
          Each promotion verifies that both tags have identical manifests.
          Updating these tags does not deploy the images,
          run migrations, or alter existing Vault data.

          ## Upgrade and deployment requirements

          Apply the additive Core access-audit migrations and upgrade Core before
          Agents. Preserve each Agent's state directory, including its new
          \`access-audit/observations.wal\` journal. Unavailable or exhausted journal
          storage refuses new secret delivery with \`AUDIT_UNAVAILABLE\`. Retention
          remains disabled by default and has no automatic deletion scheduler.
          Older Agents provide partial evidence; review reporting health before
          interpreting an empty result as inactivity.

          Credential-free local reads require both Core and Agent to support
          \`local_socket_read_v1\`, an Agent read policy, and the existing verified
          \`typed_runtime_authorization\` gate. This release does not lower the
          application authentication floor. Follow the local Agent guide to
          verify the preflight gate before using the new read path.

          This release defaults to the restricted single-operator profile. Read the
          [runtime contract](https://github.com/${REPOSITORY}/blob/${RELEASE_TAG}/docs/security/runtime-contract.md)
          and [operations guide](https://github.com/${REPOSITORY}/blob/${RELEASE_TAG}/docs/security/launch-operations.md)
          before upgrading; the rc10 deployment environment is insufficient.

          Core now requires runtime-only \`DATABASE_URL\`, \`SECRET_KEY_BASE\`,
          \`SECRET_HUB_CLUSTER_NODE_ID\`, \`AUDIT_HMAC_KEY\`, \`AUDIT_HMAC_KEY_ID\`,
          and \`SECRET_HUB_MANAGEMENT_ORIGIN\`. Preserve historical audit signing
          keys in \`AUDIT_HMAC_VERIFICATION_KEYS\` where required. Core and Agent
          require \`RELEASE_DISTRIBUTION=none\`. Supply secrets through the documented
          environment/file inputs; do not embed them in build arguments or images.

          Management binds a private HTTP backend behind the existing Caddy mTLS
          boundary, with an explicit canonical HTTPS origin. Machine enrollment
          and Agent runtime use separate configured listeners. A published Docker
          port alone does not make the loopback management backend reachable;
          choose networking consistent with the runtime contract.

          Agent requires its HTTPS Core URL, existing host-key path, persistent
          state directory, Unix socket path, and Client Auth PKI bundle directory.
          Mount these paths for the service UID and preserve identity across upgrades.

          Legacy Vault shares (formats 1-3) require explicit authenticated recovery;
          ordinary unseal accepts v4 shares. Back up and preserve existing data and
          shares; do not reset or reinitialize an existing Vault. Read the
          [share format](https://github.com/${REPOSITORY}/blob/${RELEASE_TAG}/docs/security/shamir-v4.md)
          and [Vault recovery guide](https://github.com/${REPOSITORY}/blob/${RELEASE_TAG}/docs/security/vault-key-integrity.md).
          Inventory existing dynamic leases and rotation jobs before adopting the
          default restricted profile, which disables dynamic engines, rotation, and
          Human. The Human Vault subsystem has a separate explicit opt-in and
          runtime requirements; see the
          [Human Vault guide](https://github.com/${REPOSITORY}/blob/${RELEASE_TAG}/docs/subsystem/human-vault.md).

          Migrate the existing database explicitly and run release preflight as
          the service UID before cutover. A successful build does not establish
          production acceptance. The standalone embedded-PostgreSQL image and
          platforms beyond Linux amd64 remain outside the documented qualification;
          standalone still runs database migrations during startup.

          ## Install SecretHub CLI

          The \`secrethub_cli\` package is published to Hex.pm by this workflow.

          \`\`\`bash
          mix local.hex --force
          mix escript.install hex secrethub_cli ${RELEASE_TAG#v}
          secrethub version
          \`\`\`

          ## Notes

          ${CHANGELOG_LINK}
          EOF

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
        run: |
          set -euo pipefail

          args=(
            release create "$RELEASE_TAG"
            dist/*
            --target "$RELEASE_SHA"
            --title "SecretHub $RELEASE_TAG"
            --notes-file release_notes.md
          )

          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "Version: ${{ needs.prepare-release.outputs.tag }}"
            echo ""
            echo "Published:"
            echo "- CLI package: Hex.pm secrethub_cli"
            echo "- Core release artifacts: linux amd64, linux arm64"
            echo "- Agent release artifacts: linux amd64, linux arm64, macOS amd64, macOS arm64, Windows amd64, FreeBSD amd64"
            echo "- Docker images: core, core-standalone, agent"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-images-latest:
    name: Promote Docker Image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    needs:
      - prepare-release
      - create-release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [core, core-standalone, agent]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote and verify latest manifest
        shell: bash
        env:
          SOURCE: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ needs.prepare-release.outputs.tag }}
          TARGET: ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
        run: |
          set -euo pipefail

          docker buildx imagetools create --tag "$TARGET" "$SOURCE"
          docker buildx imagetools inspect --raw "$SOURCE" > source-manifest.json
          docker buildx imagetools inspect --raw "$TARGET" > latest-manifest.json
          cmp source-manifest.json latest-manifest.json
          docker buildx imagetools inspect "$TARGET" >> "$GITHUB_STEP_SUMMARY"
