# Copy to /etc/secrethub/agent.toml, or set SECRET_HUB_AGENT_CONFIG_FILE.
# See docs/deployment/agent-deployment-guide.md for permissions and deployment.
# Generate without existing configuration (stdout contains only TOML):
#   bin/secrethub_agent config generate > agent.toml
# After editing, validate the file without starting the Agent or contacting Core:
#   bin/secrethub_agent config validate agent.toml
# With no argument, validate selects SECRET_HUB_AGENT_CONFIG_FILE, then
# /etc/secrethub/agent.toml. The selected file must exist. Validation ignores
# per-option environment overrides and does not check key/directory access.
# Exit codes: 0 success, 1 invalid configuration, 2 invalid command usage.
# All five uncommented settings are required. At Agent startup, environment
# variables and their existing _FILE forms override these values. Restart after editing.

# One HTTPS Agent URL for enrollment; runtime WSS uses the same Core listener.
# Fresh enrollment needs no operator client certificate; runtime needs Core-issued identity.
core_url = "https://core.example.com:4665"

# Existing unencrypted RSA/ECDSA SSH private host key (Ed25519 is unsupported).
# Grant access to the service UID without making the key world-readable.
host_key_path = "/etc/ssh/ssh_host_rsa_key"

# Persistent Core-issued identity and enrollment state. Create with mode 0700.
state_dir = "/var/lib/secrethub-agent"

# Private local Unix socket. Create its parent directory before starting.
socket_path = "/run/secrethub-agent/agent.sock"

# Persistent client-auth PKI bundles. Create with mode 0700 before starting.
client_auth_bundle_dir = "/var/lib/secrethub-agent/client-auth"

# Optional PEM CA bundle, provisioned out of band, for privately signed Agent HTTPS.
# This does not replace the Core-issued runtime certificate chain.
# Relative paths resolve from this file's directory; no shell or ~ expansion.
# enrollment_ca_path = "enrollment-ca.pem"

# Optional SSH integration. Both capabilities default to disabled.
# These are separate public-lookup and signing sockets, never the private socket.
# Create the shared parent directory outside private Agent state before startup.
ssh_lookup_enabled = false
ssh_signing_enabled = false
# Explicit path/group settings are required when enabling each capability.
# ssh_lookup_socket_path = "/run/secrethub-ssh/lookup.sock"
# ssh_lookup_socket_group = "secrethub-ssh-lookup"
# ssh_signing_socket_path = "/run/secrethub-ssh-signing/agent.sock"
# ssh_signing_socket_group = "secrethub-ssh-signing"
